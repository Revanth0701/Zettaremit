# PROPOSED ONLY: do not import/sync to adopt an existing service without review.
# REVIEW ONLY: importing this blueprint creates resources; not authorized yet.
services:
  - type: web
    name: ZettaRemit-App
    repo: https://github.com/Revanth0701/Zettaremit
    branch: main
    region: oregon
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_MODE
        value: cloud
      - key: LOCAL_CREATE_TABLES
        value: "false"
      - key: SCHEMA_REVISION
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        value: zettaremit
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_CA_PATH
        value: /etc/secrets/tidb-ca.pem
      - key: ENABLE_AI_ASSISTANT
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: ENABLE_AI_AGENT
        value: "true"
      - key: RAG_EMBEDDING_PROVIDER
        value: gemini
      - key: RAG_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: RAG_BM25_FALLBACK
        value: "true"
      - key: RAG_FINAL_CHUNKS
        value: "3"
      - key: RAG_SYNC_SECONDS
        value: "60"
