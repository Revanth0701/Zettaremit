# REVIEW ONLY: importing this blueprint creates resources; not authorized yet.
services:
  - type: web
    name: zettaremit-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_MODE
        value: cloud
      - key: LOCAL_CREATE_TABLES
        value: "false"
      - key: SCHEMA_REVISION
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AIVEN_HOST
        sync: false
      - key: AIVEN_PORT
        sync: false
      - key: AIVEN_DATABASE
        value: zettaremit
      - key: AIVEN_USER
        sync: false
      - key: AIVEN_PASSWORD
        sync: false
      - key: AIVEN_CA_PATH
        value: /etc/secrets/aiven-ca.pem
      - key: ENABLE_AI_ASSISTANT
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: ENABLE_AI_AGENT
        value: "false"
      - key: RAG_EMBEDDING_PROVIDER
        value: none
      - key: RAG_BM25_FALLBACK
        value: "true"
      - key: RAG_FINAL_CHUNKS
        value: "3"
      - key: RAG_SYNC_SECONDS
        value: "60"
